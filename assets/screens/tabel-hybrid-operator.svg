<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">Табель Гибрид — интерфейс оператора</title>
  <desc id="d">Место для скриншота интерфейса оператора «Табель Гибрид»</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
