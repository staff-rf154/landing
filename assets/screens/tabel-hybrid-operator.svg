  <text x="200" y="486" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">Сканирование QR, проверка данных и отметка с геолокацией.</text>
  <rect x="200" y="560" width="240" height="240" rx="24" fill="#ffffff" fill-opacity=".07" stroke="#2dd4bf" stroke-opacity=".45" stroke-width="3"/>
