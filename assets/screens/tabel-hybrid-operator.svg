      <stop offset="1" stop-color="#0b2f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="140" y="120" width="1320" height="760" rx="32" fill="#082f39" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <rect x="140" y="120" width="1320" height="72" rx="32" fill="#ffffff" fill-opacity=".06"/>
  <rect x="140" y="160" width="1320" height="32" fill="#ffffff" fill-opacity=".06"/>
  <circle cx="190" cy="156" r="9" fill="#f87171"/>
  <circle cx="220" cy="156" r="9" fill="#fbbf24"/>
  <circle cx="250" cy="156" r="9" fill="#34d399"/>
  <rect x="200" y="260" width="260" height="14" rx="7" fill="url(#accent)"/>
