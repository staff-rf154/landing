name: landing

services:
  landing:
    build:
      context: .
      dockerfile: cms/Dockerfile
    image: landing
    container_name: landing
    restart: unless-stopped
    env_file: ./cms.env
    environment:
      DATA_DIR: /data
      SITE_DIR: /app
    volumes:
      - ./content:/data
    ports:
      - "${LANDING_PORT:-8080}:8000"
    networks:
      default:
        aliases:
          - landing-cms
          - landing-web-1
      tabel:
        aliases:
          - landing-cms
          - landing-web-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tabel:
    name: tabel_tabel
    external: true
